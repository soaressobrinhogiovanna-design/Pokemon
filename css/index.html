
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="pokedex">
        <h1>Pokédex</h1>

        <div class="pesquisa">
            <input type="text" id="pokemon" placeholder="Nome ou número">
            <button type="button" id="buscar">Buscar</button>
        </div>

        <p id="mensagem"></p>

        <section class="card">
            <div class="cabecalho">
                <h2 id="nome">Pikachu</h2>
                <span id="numero">#025</span>
            </div>

            <div class="imagem-container">
                <img id="imagem"
                    src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/25.png"
                    alt="Pikachu">
            </div>

            <div class="informacoes">
                <div class="linha">
                    <strong>Tipo:</strong>
                    <div id="tipos">Elétrico</div>
                </div>

                <div class="linha">
                    <strong>Altura:</strong>
                    <span id="altura">0.4 m</span>
                </div>

                <div class="linha">
                    <strong>Peso:</strong>
                    <span id="peso">6.0 kg</span>
                </div>
            </div>

            <div class="status">
                <h3>Estatísticas</h3>

                <p>HP: <span id="hp">35</span></p>
                <p>Ataque: <span id="ataque">55</span></p>
                <p>Defesa: <span id="defesa">40</span></p>
                <p>Velocidade: <span id="velocidade">90</span></p>
            </div>
        </section>
    </main>

    <script src="java.js"></script>
</body>
</html>
